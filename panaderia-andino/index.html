<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#653820"><title>Panadería Andino</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f1e7;color:#55331f;font:14px system-ui,sans-serif}.loading{padding:26px;text-align:center}.mark{font-size:38px}.error{max-width:420px;padding:20px;text-align:center}</style></head><body><div class="loading" id="loading"><div class="mark">🥐</div><strong>Panadería Andino</strong><p>Abriendo el sistema…</p></div><script>
(async()=>{try{if(!('DecompressionStream' in window))throw new Error('Tu navegador no permite abrir esta versión. Actualizá Chrome, Edge o Firefox.');const parts=await Promise.all([1,2,3].map(async n=>{const r=await fetch('/app.bundle.part'+n,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar la aplicación.');return new Uint8Array(await r.arrayBuffer());}));const size=parts.reduce((n,p)=>n+p.length,0);const joined=new Uint8Array(size);let offset=0;for(const part of parts){joined.set(part,offset);offset+=part.length;}const stream=new Blob([joined]).stream().pipeThrough(new DecompressionStream('gzip'));const app=await new Response(stream).text();document.open();document.write(app);document.close();}catch(e){document.getElementById('loading').innerHTML='<div class="error"><div class="mark">🥐</div><strong>Panadería Andino</strong><p>'+String(e.message||'Error al abrir la aplicación.')+'</p><button onclick="location.reload()">Volver a intentar</button></div>';}})();
</script></body></html>
