<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#512b19">
  <meta name="application-name" content="Gestión Panadería Administrador">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GP Admin">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="icon" href="/icons/admin.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/admin.svg">
  <title>Gestión Panadería · Administrador</title>
  <style>html,body{width:100%;height:100%;margin:0;background:#fbf5eb}body{overflow:hidden}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}</style>
</head>
<body>
  <iframe id="adminAppFrame" title="Gestión Panadería Administrador" src="/app.bundle.html?app=admin#administracion" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    // El panel vive dentro de un iframe: reenviar el fragmento de recuperación
    // desde la URL exterior para que auth.js pueda mostrar el formulario.
    (function () {
      var fragment = window.location.hash || '';
      if (/^#recuperar=[a-f0-9]{64}$/i.test(fragment) || /^#emitir-recuperacion=/.test(fragment)) {
        document.getElementById('adminAppFrame').src = '/app.bundle.html?app=admin' + fragment;
      }
    })();
  </script>
</body>
</html>
