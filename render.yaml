services:
  - type: web
    name: panaderia-andino
    runtime: node
    plan: free
    region: virginia
    rootDir: .
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: panaderia-andino-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: matt7atx@gmail.com
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false

databases:
  - name: panaderia-andino-db
    databaseName: panaderia_andino_db
    user: panaderia_andino_db_user
    plan: free
    region: virginia
    postgresMajorVersion: 18
