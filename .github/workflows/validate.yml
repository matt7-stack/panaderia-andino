name: Validate source
on:
  push:
    branches:
      - feature/erp-multiempresa
      - fix/admin-client-panels-licenses-preview
      - security/hardening-2026-11-25
      - feat/employee-offboarding-2026-11-26
      - feat/industry-library-license-config-2026-11-26
  pull_request:
    branches:
      - main
      - integration/gestion-negocio-2026-11
      - feat/admin-private-finance-notes-qa
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and configuration
        working-directory: panaderia-andino
        run: node scripts/validate-source.js
