name: MATTSYSTEM QA source validation

on:
  push:
    branches:
      - feat/business-improvements-suite-2026-11-27
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application source
        run: npm test --prefix panaderia-andino
